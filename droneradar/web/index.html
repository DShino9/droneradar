<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DroneRadar</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>

<!-- The sky sits behind everything. Two cloud layers rather than one so they
     drift at different speeds and the bank never reads as a single sheet
     sliding past. -->
<div class="sky" aria-hidden="true">
  <span class="cl cl1"></span>
  <span class="cl cl2"></span>
</div>

<header class="topbar">
  <div class="brand">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" class="brand-mark">
      <circle cx="6" cy="6" r="3"/><circle cx="18" cy="6" r="3"/>
      <circle cx="6" cy="18" r="3"/><circle cx="18" cy="18" r="3"/>
      <rect x="9.5" y="9.5" width="5" height="5" rx="1.2"/>
      <path d="M8 8l-1.4-1.4M16 8l1.4-1.4M8 16l-1.4 1.4M16 16l1.4 1.4"/>
    </svg>
    <span>DroneRadar</span>
  </div>

  <input id="search" type="search" placeholder="収集済みの記事を絞り込み" autocomplete="off">

  <div class="seg" id="range-seg" role="group" aria-label="期間">
    <button data-range="1">24時間</button>
    <button data-range="3">3日</button>
    <button data-range="7" class="on">1週間</button>
    <button data-range="30">1か月</button>
    <button data-range="0">すべて</button>
  </div>

  <div class="seg" id="lang-seg" role="group" aria-label="言語">
    <button data-lang="all" class="on">日+英</button>
    <button data-lang="ja">日本語</button>
    <button data-lang="en">英語</button>
  </div>

  <button id="img-only" class="ghost" aria-pressed="false" title="画像のある記事だけを表示">画像あり</button>

  <select id="sort" aria-label="並び替え">
    <option value="new">新着順</option>
    <option value="important">重要度順</option>
    <option value="cluster">話題度順</option>
  </select>

  <!-- These were a row of their own above the articles. That row cost about
       thirty pixels of the one part of the page meant for reading, to hold two
       switches and a title the sidebar already shows. -->
  <button id="graphics-toggle" class="chip-toggle" aria-pressed="true"
          title="日本地図・世界地図・連続再生の表示を切り替えます">地図・動画</button>
  <button id="group-toggle" class="chip-toggle" aria-pressed="true"
          title="記事をジャンル別にまとめるか、新着順の一覧にするか">分類ごと</button>
  <button id="clear-filters" class="chip hidden">絞り込みを解除</button>

  <button id="refresh" class="ghost" title="いま収集する">
    <span class="dot" id="live-dot"></span><span id="updated">—</span>
  </button>
</header>

<div class="shell">

  <nav class="sidebar" id="sidebar">
    <div class="nav-group" id="nav-main"></div>
    <div class="nav-label">カテゴリ</div>
    <div class="nav-group" id="nav-cats"></div>
    <div class="nav-label">表示</div>
    <div class="nav-group" id="nav-views"></div>

    <!-- The quotes list is a column of short rows, which is what the narrow
         sidebar can actually hold; the live feed needs the width and has gone
         to the rail. -->
    <div class="panel stock-panel">
      <div class="panel-head">
        <h2>関連株</h2>
        <span class="hint" id="stock-meta">—</span>
      </div>
      <div id="stocks" class="stocks"></div>
    </div>

    <!-- Every other panel says what is there. This one says what is different
         today, which is the question a board called a radar should answer. -->
    <div class="panel rise-panel">
      <div class="panel-head">
        <h2>急上昇</h2>
        <span class="hint" id="rising-meta">—</span>
      </div>
      <div id="rising" class="rising"></div>
    </div>
  </nav>

  <main class="main" id="main">

    <section id="view-feed">
      <div id="highlights" class="ledboard" role="region" aria-label="重要ニュース">
        <div class="led-label">重要</div>
        <div class="led-window"><div class="led-track" id="led-track"></div></div>
      </div>

      <div class="graphics" id="graphics">
        <div class="panel map-panel">
          <div class="panel-head">
            <h2>都道府県別</h2>
            <span class="hint" id="map-hint-jp"></span>
          </div>
          <div class="map-wrap">
            <svg id="map-jp" preserveAspectRatio="xMidYMin meet" role="img"
                 aria-label="日本地図上のドローン関連ニュース件数"></svg>
            <div class="map-caption" id="map-caption-jp" aria-live="polite"></div>
          </div>
        </div>

        <div class="panel world-panel">
          <div class="panel-head">
            <h2>国別</h2>
            <span class="hint" id="map-hint-world"></span>
          </div>
          <div class="map-wrap">
            <svg id="map-world" preserveAspectRatio="xMidYMin meet" role="img"
                 aria-label="世界地図上のドローン関連ニュース件数"></svg>
            <div class="map-caption" id="map-caption-world" aria-live="polite"></div>
          </div>
        </div>

        <!-- The player lives here, outside anything renderCards rebuilds: moving
             or recreating an iframe reloads it, which killed autoplay. -->
        <div class="panel player-panel">
          <div class="panel-head">
            <h2>連続再生</h2>
            <span class="hint" id="player-count">—</span>
          </div>
          <div class="player-wrap">
            <iframe id="player" class="video-frame" title="ドローン動画の連続再生"
                    allow="autoplay; encrypted-media; picture-in-picture"
                    referrerpolicy="strict-origin-when-cross-origin"
                    allowfullscreen></iframe>
            <div id="player-now" class="video-now"></div>
            <div class="video-note">無音で自動再生 · 終わると次の動画へ進みます</div>
            <div id="player-queue" class="video-queue"></div>
          </div>
        </div>
      </div>

      <!-- The title and count live in the topbar now; the sidebar was already
           showing both, and the row they were on cost the articles a line. -->
      <div class="feed-head hidden">
        <h2 id="feed-title">すべて</h2>
        <span id="feed-count" class="count"></span>
      </div>
      <div id="cards" class="cards"></div>
      <div id="empty" class="empty hidden">条件に合う記事がありません。</div>
      <button id="more" class="more hidden">さらに読み込む</button>
    </section>

    <section id="view-sources" class="hidden"></section>

  </main>

  <aside class="rail" id="rail">

    <div class="panel cal-panel">
      <div class="panel-head">
        <h2>イベント暦</h2>
        <span class="hint" id="cal-hint">—</span>
      </div>
      <div id="cal-months" class="cal-months"></div>
      <div id="cal-list" class="cal-list"></div>
    </div>

    <div class="panel radar-panel">
      <div class="panel-head">
        <h2>ライブレーダー</h2>
        <span class="hint" id="radar-hint">—</span>
      </div>
      <!-- The tooltip is ours, not the browser's: a native one waits a second,
           shows one line, and vanishes on the smallest movement. -->
      <div class="radar-wrap">
        <svg id="radar" viewBox="0 0 268 200" role="img"
         aria-label="直近の記事とSNS投稿をレーダー状に表示"></svg>
        <div id="radar-tip" class="radar-tip hidden" role="tooltip"></div>
      </div>
      <div class="radar-legend">
        <span><i class="k-art"></i>記事</span>
        <span><i class="k-x"></i>X・SNS</span>
        <span><i class="k-imp"></i>重要</span>
        <span class="grow">中心ほど新着</span>
      </div>
    </div>

    <div class="panel live-panel" id="live-panel">
      <div class="panel-head">
        <h2>リアルタイム</h2>
        <div class="seg mini" id="net-seg">
          <button data-net="all" class="on">全部</button>
          <button data-net="x">X</button>
          <button data-net="mastodon">Mastodon</button>
          <button data-net="reddit">Reddit</button>
        </div>
      </div>
      <div id="trends" class="trends"></div>
      <div id="ticker" class="ticker" aria-live="polite"></div>
      <div class="panel-foot"><span id="ticker-meta">—</span></div>
    </div>

  </aside>
</div>

<div id="toast" class="toast hidden"></div>

<script src="https://www.youtube.com/iframe_api"></script>
<script type="module" src="./js/main.js"></script>
</body>
</html>
